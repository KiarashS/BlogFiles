<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Banner: what I actually use Droppy for - clipboard, music, Droplets" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0C11"/>
      <stop offset="0.55" stop-color="#0E131B"/>
      <stop offset="1" stop-color="#141A24"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3E7BFF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#3E7BFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3E7BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B212C"/>
      <stop offset="1" stop-color="#12161E"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B38" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1A202B" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FA8FF"/>
      <stop offset="1" stop-color="#2F6FED"/>
    </linearGradient>

    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="0.5" stop-color="#C0468F"/>
      <stop offset="1" stop-color="#4C4BE0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FA8FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#8FB4FF" fill-opacity="0.055"/>
    </pattern>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <clipPath id="artclip">
      <rect x="1078" y="212" width="88" height="88" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#dots)"/>
  <ellipse cx="1145" cy="300" rx="470" ry="330" fill="url(#glow)"/>

  <!-- text block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', Helvetica, Arial, sans-serif">
    <g transform="translate(112,168)">
      <rect x="0" y="-22" width="9" height="9" rx="4.5" fill="#6FA8FF"/>
      <text x="26" y="-14" fill="#8FA3BF" font-size="17" font-weight="600" letter-spacing="3.4">REAL USE, MAC</text>
    </g>

    <text x="112" y="272" fill="#F2F5FA" font-size="58" font-weight="700" letter-spacing="-1.2">What I actually use</text>
    <text x="112" y="342" fill="#F2F5FA" font-size="58" font-weight="700" letter-spacing="-1.2">Droppy for</text>

    <rect x="112" y="382" width="230" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="112" y="440" fill="#9DB0CA" font-size="25" font-weight="500">Clipboard, music, and the Droplets</text>
    <text x="112" y="476" fill="#9DB0CA" font-size="25" font-weight="500">I kept switched on.</text>
  </g>

  <!-- island + shelf -->
  <g>
    <ellipse cx="1145" cy="330" rx="300" ry="150" fill="#2F6FED" fill-opacity="0.30" filter="url(#soft)"/>

    <!-- collapsed pill merging into the shelf -->
    <rect x="1063" y="112" width="164" height="46" rx="23" fill="#12161E"/>
    <rect x="1063" y="112" width="164" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <circle cx="1092" cy="135" r="7" fill="url(#blue)"/>
    <g fill="#7E93B0">
      <rect x="1112" y="130" width="3" height="10" rx="1.5"/>
      <rect x="1120" y="125" width="3" height="20" rx="1.5"/>
      <rect x="1128" y="128" width="3" height="14" rx="1.5"/>
      <rect x="1136" y="122" width="3" height="26" rx="1.5"/>
      <rect x="1144" y="127" width="3" height="16" rx="1.5"/>
      <rect x="1152" y="131" width="3" height="8" rx="1.5"/>
    </g>
    <rect x="1176" y="128" width="36" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>

    <!-- shelf panel -->
    <rect x="865" y="150" width="560" height="286" rx="34" fill="url(#panel)"/>
    <rect x="865" y="150" width="560" height="286" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="881" y="166" width="528" height="120" rx="24" fill="#FFFFFF" fill-opacity="0.02"/>

    <!-- card 1: clipboard -->
    <g>
      <rect x="889" y="190" width="160" height="222" rx="22" fill="url(#card)"/>
      <rect x="889" y="190" width="160" height="222" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <rect x="953" y="212" width="32" height="40" rx="7" fill="none" stroke="url(#blue)" stroke-width="3"/>
      <rect x="961" y="205" width="16" height="12" rx="5" fill="url(#blue)"/>
      <g fill="#8FA6C4">
        <rect x="913" y="276" width="112" height="10" rx="5" fill-opacity="0.85"/>
        <rect x="913" y="298" width="84" height="10" rx="5" fill-opacity="0.6"/>
        <rect x="913" y="320" width="100" height="10" rx="5" fill-opacity="0.4"/>
        <rect x="913" y="342" width="62" height="10" rx="5" fill-opacity="0.25"/>
      </g>
      <text x="969" y="392" text-anchor="middle" fill="#7C90AD" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">Clipboard</text>
    </g>

    <!-- card 2: music -->
    <g>
      <rect x="1065" y="190" width="160" height="222" rx="22" fill="url(#card)"/>
      <rect x="1065" y="190" width="160" height="222" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <rect x="1078" y="212" width="88" height="88" rx="16" fill="url(#art)"/>
      <g clip-path="url(#artclip)" opacity="0.4">
        <circle cx="1122" cy="256" r="34" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="1122" cy="256" r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      </g>
      <rect x="1176" y="222" width="38" height="9" rx="4.5" fill="#8FA6C4" fill-opacity="0.8"/>
      <rect x="1176" y="240" width="26" height="9" rx="4.5" fill="#8FA6C4" fill-opacity="0.45"/>
      <path d="M1181 270 l22 13 -22 13 z" fill="url(#blue)"/>
      <rect x="1078" y="318" width="132" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.12"/>
      <rect x="1078" y="318" width="72" height="6" rx="3" fill="url(#blue)"/>
      <g fill="#6FA8FF" fill-opacity="0.75">
        <rect x="1080" y="344" width="4" height="12" rx="2"/>
        <rect x="1092" y="338" width="4" height="24" rx="2"/>
        <rect x="1104" y="332" width="4" height="36" rx="2"/>
        <rect x="1116" y="340" width="4" height="20" rx="2"/>
        <rect x="1128" y="334" width="4" height="32" rx="2"/>
        <rect x="1140" y="342" width="4" height="16" rx="2"/>
        <rect x="1152" y="336" width="4" height="28" rx="2"/>
        <rect x="1164" y="345" width="4" height="10" rx="2"/>
        <rect x="1176" y="339" width="4" height="22" rx="2"/>
        <rect x="1188" y="343" width="4" height="14" rx="2"/>
        <rect x="1200" y="341" width="4" height="18" rx="2"/>
      </g>
      <text x="1145" y="392" text-anchor="middle" fill="#7C90AD" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">Music</text>
    </g>

    <!-- card 3: droplets -->
    <g>
      <rect x="1241" y="190" width="160" height="222" rx="22" fill="url(#card)"/>
      <rect x="1241" y="190" width="160" height="222" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <path d="M1321 204 C1341 232, 1349 246, 1349 258 A28 28 0 0 1 1293 258 C1293 246, 1301 232, 1321 204 Z" fill="url(#blue)"/>
      <ellipse cx="1311" cy="252" rx="7" ry="9" fill="#FFFFFF" fill-opacity="0.35"/>
      <g>
        <rect x="1265" y="304" width="112" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.07"/>
        <circle cx="1281" cy="317" r="7" fill="url(#blue)"/>
        <rect x="1296" y="313" width="54" height="8" rx="4" fill="#8FA6C4" fill-opacity="0.6"/>
        <rect x="1265" y="340" width="112" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.05"/>
        <circle cx="1281" cy="353" r="7" fill="#8FA6C4" fill-opacity="0.35"/>
        <rect x="1296" y="349" width="38" height="8" rx="4" fill="#8FA6C4" fill-opacity="0.35"/>
      </g>
      <text x="1321" y="392" text-anchor="middle" fill="#7C90AD" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">Droplets</text>
    </g>

    <!-- copied chip -->
    <g transform="translate(806,344)">
      <rect x="0" y="0" width="118" height="40" rx="20" fill="#12161E" stroke="#6FA8FF" stroke-opacity="0.35"/>
      <circle cx="24" cy="20" r="8" fill="url(#blue)"/>
      <path d="M20 20 l3 3 6 -7" fill="none" stroke="#0A0C11" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="26" fill="#B9CBE6" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">Copied</text>
    </g>
  </g>

  <rect x="0" y="596" width="1600" height="4" fill="url(#blue)" opacity="0.55"/>
</svg>
